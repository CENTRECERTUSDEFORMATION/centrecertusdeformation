    <!-- ✅ Styles CSS critiques pour le LCP (Largest Contentful Paint) -->

      /* Styles critiques pour éviter le flash de contenu non stylisé */
      body {
        margin: 0;
        padding: 0;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

        display: flex;
        flex-direction: column;
      }
      /* Chargement initial */
      .loading-spinner {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-size: 1.5rem;
        color: #1a56db;
      }

  <body>
    <!-- ✅ Élément pour le chargement initial -->
    <div id="root">

            <animate attributeName="stroke-dashoffset" from="100" to="0" dur="1.5s" repeatCount="indefinite"/>

        </svg>
      </div>
    </div>
    
    <!-- ✅ Script principal - type module -->
